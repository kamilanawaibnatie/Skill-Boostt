<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Kamila Nawa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap');

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #ffe6ef;
            /* background bunga + pita lucu */
            background-image: url('https://i.pinimg.com/736x/8a/8a/8c/8a8a8c8c9c8c8c8c8c8c8c8c.jpg');
            background-size: 350px;
            min-height: 100vh;
        }

        /* overlay biar tetep pink soft */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 230, 239, 0.75);
            z-index: -1;
        }

        nav {
            background: #ff8fab;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(255, 143, 171, 0.4);
            position: sticky;
            top: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: 600;
            background: #ffb3c6;
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            background: white;
            color: #ff8fab;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 143, 171, 0.3);
            border: 3px dashed #ffb3c6;
            position: relative;
        }

        /* pita lucu di pojok */
        .card::before {
            content: "🎀";
            font-size: 50px;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
        }

        h1 {
            font-family: 'Pacifico', cursive;
            text-align: center;
            color: #ff4d8a;
            font-size: 32px;
            margin-top: 10px;
        }

        label {
            color: #ff4d8a;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 2px solid #ffb3c6;
            border-radius: 15px;
            background: #fff0f5;
            outline: none;
            font-family: 'Poppins';
        }

        input:focus, textarea:focus {
            border-color: #ff4d8a;
            background: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff4d8a;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff8fab;
            transform: scale(1.03);
        }

        .flowers {
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🌸 Home</a>
        <a href="cv-Kamila.pdf">🎀 Download CV</a>
        <a href="about.html">💌 about me</a>
        <a href="contact.html">🌷 contact</a>
    </nav>

    <div class="card">
        <h1>Contact Me</h1>
        <div class="flowers">🌷🌸🎀🌸🌷</div>

        <form action="mailto:ibnatikamilanawa@gmail.com" method="post" enctype="text/plain">
            <label for="email">your email 💌</label><br>
            <input type="email" name="email" id="email" placeholder="kamila.cantik@email.com" required><br>

            <label for="message">pesan buat aku 🎀</label><br>
            <textarea name="message" id="message" cols="30" rows="5" placeholder="hai kamila... 🌸" required></textarea><br>

            <button type="submit">Kirim Pesan 💖</button>
        </form>
    </div>
</body>
</html>
